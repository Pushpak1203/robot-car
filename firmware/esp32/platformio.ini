; PlatformIO Project Configuration File for ESP32 AI RC Car
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Dependencies for JSON protocol and WebSocket communications
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    links2004/WebSockets @ ^2.4.1

build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
